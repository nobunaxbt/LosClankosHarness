[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-city-harness"
version = "0.1.0"
readme = "README.md"
description = "A local single-character game controller with fast Jev decisions and live human orders"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jev-city = "jev_city.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
